name: Build Windows Installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand source archive
        shell: pwsh
        run: |
          if (!(Test-Path "source.tar.xz.b64")) { throw "source.tar.xz.b64 not found" }
          $b64 = (Get-Content "source.tar.xz.b64" -Raw).Trim()
          [System.IO.File]::WriteAllBytes("source.tar.xz", [Convert]::FromBase64String($b64))
          & tar.exe -xJf "source.tar.xz"
          if ($LASTEXITCODE -ne 0) { throw "Failed to extract source archive" }
          if (!(Test-Path ".\scripts\build_windows.ps1")) { throw "Source extraction did not produce build script" }
          $specPath = ".\build\Transcriber.spec"
          $spec = Get-Content $specPath -Raw
          $spec = $spec.Replace('("assets/app.ico", "assets")', '("../assets/app.ico", "assets")')
          $spec = $spec.Replace('["src/main.py"]', '["../src/main.py"]')
          $spec = $spec.Replace('pathex=["src"]', 'pathex=["../src"]')
          $spec = $spec.Replace('icon="assets/app.ico"', 'icon="../assets/app.ico"')
          Set-Content -Path $specPath -Value $spec -Encoding utf8

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*" -Recurse -Filter ISCC.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after Inno Setup installation" }
          "INNO_ISCC=$($iscc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build application and installer
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\scripts\build_windows.ps1

      - name: End-to-end CPU transcription smoke test
        shell: pwsh
        run: |
          .\.build-venv\Scripts\python.exe -m pip install edge-tts
          .\.build-venv\Scripts\python.exe -m edge_tts --voice ru-RU-SvetlanaNeural --text "Привет. Это тест программы для транскрибации русской речи. Сейчас мы проверяем распознавание." --write-media test_ru.mp3
          if (!(Test-Path ".\test_ru.mp3")) { throw "Russian test audio was not generated" }
          $app = Resolve-Path ".\dist\Transcriber\Transcriber.exe"
          $out = Join-Path $env:TEMP "transcriber-selftest.txt"
          Remove-Item $out -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $app -ArgumentList @("--self-test", (Resolve-Path ".\test_ru.mp3"), "--self-test-output", $out) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Packaged CPU transcription self-test failed with exit code $($p.ExitCode)" }
          if (!(Test-Path $out)) { throw "Self-test output file was not created" }
          $text = Get-Content $out -Raw -Encoding utf8
          Write-Host "Transcribed text: $text"
          if ($text -notmatch "[А-Яа-яЁё]") { throw "Self-test did not produce Russian text" }

      - name: Verify installer is Windows PE
        shell: pwsh
        run: |
          $installer = Resolve-Path ".\dist_installer\TranscriberSetup.exe"
          $bytes = [System.IO.File]::ReadAllBytes($installer)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw "Installer is not a valid Windows PE executable"
          }
          Write-Host "Verified MZ header: $installer"

      - name: Silent install smoke test
        shell: pwsh
        run: |
          $installer = Resolve-Path ".\dist_installer\TranscriberSetup.exe"
          $p = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed with exit code $($p.ExitCode)" }
          $app = "C:\Program Files\Russian Transcriber\Transcriber.exe"
          if (!(Test-Path $app)) { throw "Installed Transcriber.exe not found at $app" }
          $proc = Start-Process -FilePath $app -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited -and $proc.ExitCode -ne 0) { throw "Installed application exited with code $($proc.ExitCode)" }
          if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          Write-Host "Installed application launched successfully"
          $testAudio = Resolve-Path ".\test_ru.mp3"
          $out = Join-Path $env:TEMP "installed-transcriber-selftest.txt"
          Remove-Item $out -ErrorAction SilentlyContinue
          $p2 = Start-Process -FilePath $app -ArgumentList @("--self-test", $testAudio, "--self-test-output", $out) -Wait -PassThru
          if ($p2.ExitCode -ne 0) { throw "Installed application transcription self-test failed with exit code $($p2.ExitCode)" }
          $txt = Get-Content $out -Raw -Encoding utf8
          if ($txt -notmatch "[А-Яа-яЁё]") { throw "Installed application did not produce Russian text" }
          Write-Host "Installed app transcription: $txt"

      - name: Silent uninstall smoke test
        shell: pwsh
        run: |
          $uninstaller = "C:\Program Files\Russian Transcriber\unins000.exe"
          if (!(Test-Path $uninstaller)) { throw "Uninstaller not found" }
          $p = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($p.ExitCode)" }
          Write-Host "Uninstall completed successfully"

      - name: Generate SHA256
        shell: pwsh
        run: |
          $installer = Resolve-Path ".\dist_installer\TranscriberSetup.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          "$hash  TranscriberSetup.exe" | Set-Content ".\dist_installer\SHA256SUMS.txt" -Encoding ascii
          Write-Host "SHA256=$hash"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: RussianTranscriber-Windows-1.0.1
          path: |
            dist_installer/TranscriberSetup.exe
            dist_installer/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RussianTranscriber-build-logs
          path: |
            build/
            *.log
            dist_installer/SHA256SUMS.txt
          if-no-files-found: ignore
