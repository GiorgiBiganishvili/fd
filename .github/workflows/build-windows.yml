name: Build GuitarTabAI Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand source
        shell: pwsh
        run: |
          if (!(Test-Path "GuitarTabAISource.zip")) { throw "GuitarTabAISource.zip not found" }
          New-Item -ItemType Directory -Force -Path appsrc | Out-Null
          Expand-Archive -Path "GuitarTabAISource.zip" -DestinationPath "appsrc" -Force

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: "appsrc/pyproject.toml"

      - name: Install build dependencies
        shell: pwsh
        working-directory: appsrc
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install . pytest pyinstaller
          choco install ffmpeg innosetup --yes --no-progress

      - name: Run tests
        shell: pwsh
        working-directory: appsrc
        run: python -m pytest -q

      - name: Build application
        shell: pwsh
        working-directory: appsrc
        run: |
          $ffmpeg = (Get-Command ffmpeg.exe -ErrorAction Stop).Source
          python -m PyInstaller --noconfirm --clean --windowed --name GuitarTabAI --collect-all PySide6 --collect-all soundfile --hidden-import scipy.signal --add-binary "$ffmpeg;." guitar_tab_ai/app/main.py
          if (!(Test-Path ".\dist\GuitarTabAI\GuitarTabAI.exe")) { throw "GuitarTabAI.exe was not produced" }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path ".\dist\GuitarTabAI\GuitarTabAI.exe"))
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "GuitarTabAI.exe is not Windows PE" }

      - name: Build installer
        shell: pwsh
        working-directory: appsrc
        run: |
          New-Item -ItemType Directory -Force -Path dist_installer | Out-Null
          @'
          [Setup]
          AppId={{B74CF460-0FCA-4B31-8D40-7B1B68E5B838}
          AppName=Guitar Tab AI
          AppVersion=0.1.0
          AppPublisher=Giorgi Biganishvili
          DefaultDirName={localappdata}\Programs\Guitar Tab AI
          DefaultGroupName=Guitar Tab AI
          OutputDir=dist_installer
          OutputBaseFilename=GuitarTabAISetup
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          PrivilegesRequired=lowest
          UninstallDisplayIcon={app}\GuitarTabAI.exe

          [Files]
          Source: "dist\GuitarTabAI\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\Guitar Tab AI"; Filename: "{app}\GuitarTabAI.exe"
          Name: "{autodesktop}\Guitar Tab AI"; Filename: "{app}\GuitarTabAI.exe"

          [Run]
          Filename: "{app}\GuitarTabAI.exe"; Description: "Launch Guitar Tab AI"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content -Encoding UTF8 installer.iss
          $iscc = (Get-ChildItem "C:\Program Files (x86)\Inno Setup*" -Recurse -Filter ISCC.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Verify installer and silent install
        shell: pwsh
        working-directory: appsrc
        run: |
          $installer = Resolve-Path ".\dist_installer\GuitarTabAISetup.exe"
          $bytes = [System.IO.File]::ReadAllBytes($installer)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Installer is not Windows PE" }
          $p = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer returned $($p.ExitCode)" }
          $installed = Join-Path $env:LOCALAPPDATA "Programs\Guitar Tab AI\GuitarTabAI.exe"
          if (!(Test-Path $installed)) { throw "Installed GuitarTabAI.exe not found" }
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          "$hash  GuitarTabAISetup.exe" | Set-Content ".\dist_installer\SHA256SUMS.txt" -Encoding ascii
          Write-Host "SHA256=$hash"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: GuitarTabAI-Windows-0.1.0
          path: |
            appsrc/dist_installer/GuitarTabAISetup.exe
            appsrc/dist_installer/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
