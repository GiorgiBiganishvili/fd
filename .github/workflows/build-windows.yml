name: Build Windows Installer
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      TF_CPP_MIN_LOG_LEVEL: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - name: Install media tools and Inno Setup
        shell: pwsh
        run: |
          choco install ffmpeg tesseract innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey failed" }
          $env:PATH += ";C:\Program Files\Tesseract-OCR"
          "C:\Program Files\Tesseract-OCR" | Out-File $env:GITHUB_PATH -Append
      - run: uv sync --locked --python 3.11 --extra ml --extra dev --extra build
      - run: uv run --no-sync pytest -q --junitxml=test-results.xml
      - name: Build application and installer
        shell: pwsh
        run: .\scripts\build_windows.ps1
      - name: Verify install, packaged pipeline, launch and uninstall
        shell: pwsh
        run: |
          $installer = Resolve-Path dist_installer\GuitarTabAISetup.exe
          $bytes = [IO.File]::ReadAllBytes($installer)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Not a Windows PE" }
          $p = Start-Process $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
          $app = "C:\Program Files\Guitar Tab AI\GuitarTabAI.exe"
          if (!(Test-Path $app)) { throw "Installed application missing" }
          $inputVideo = Join-Path $env:RUNNER_TEMP "guitar-smoke.mp4"
          ffmpeg -v error -y -f lavfi -i "color=c=black:s=320x180:r=30:d=2" -f lavfi -i "sine=frequency=329.627:duration=2" -c:v mpeg4 -c:a aac -shortest $inputVideo
          if ($LASTEXITCODE -ne 0) { throw "Fixture creation failed" }
          $result = Join-Path $env:RUNNER_TEMP "smoke.gtabproject"
          $analysis = Start-Process $app -ArgumentList "--analyze",('"' + $inputVideo + '"'),"--audio-only","--output",('"' + $result + '"') -Wait -PassThru
          if ($analysis.ExitCode -ne 0 -or !(Test-Path $result)) { throw "Packaged analysis failed" }
          uv run --no-sync python -c "from pathlib import Path; from guitar_tab_ai.storage.project_storage import load_project; p=load_project(Path(r'$result')); assert any(n.midi==64 for n in p.notes)"
          if ($LASTEXITCODE -ne 0) { throw "Packaged note transcription invalid" }
          $proc = Start-Process $app -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited) { throw "Application exited unexpectedly: $($proc.ExitCode)" }
          Stop-Process -Id $proc.Id -Force
          $uninstall = Start-Process "C:\Program Files\Guitar Tab AI\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstall failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: GuitarTabAI-Windows-0.1.0
          path: |
            dist_installer/GuitarTabAISetup.exe
            dist_installer/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-build-logs
          path: |
            build/**/*.txt
            test-results.xml
