name: Build Shorts Cutter Windows Installer
on:
  push:
    branches: [ shorts-cutter-build ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: shorts_cutter_beta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile and import 0.3.1 modules
        shell: pwsh
        run: |
          python -m compileall -q .
          python -c "import transcription, semantic_engine, editing, captions, render_engine, project_store, main, ui_theme, ui_shell, launcher; print('Shorts Cutter 0.3.1 modules OK')"
      - name: Smoke-test polished UI shell
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "from PySide6.QtWidgets import QApplication; from ui_theme import apply_app_theme; from ui_shell import StudioWindow; app=QApplication([]); apply_app_theme(app); w=StudioWindow(); assert w.tabs.count()==4; assert w.windowTitle()=='Shorts Cutter 0.3.1 Beta'; print('Polished UI shell OK')"
      - name: Bundle known-good FFmpeg
        shell: pwsh
        run: |
          $url='https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-8.1.zip'
          Invoke-WebRequest -Uri $url -OutFile ffmpeg-btb.zip
          Expand-Archive -Path ffmpeg-btb.zip -DestinationPath ffmpeg-btb -Force
          $ff=(Get-ChildItem ffmpeg-btb -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName
          $fp=(Get-ChildItem ffmpeg-btb -Recurse -Filter ffprobe.exe | Select-Object -First 1).FullName
          if (-not $ff -or -not $fp) { throw 'BtbN FFmpeg binaries not found after extraction' }
          New-Item -ItemType Directory -Force tools | Out-Null
          Copy-Item $ff tools\ffmpeg.exe
          Copy-Item $fp tools\ffprobe.exe
          & tools\ffmpeg.exe -version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled BtbN ffmpeg.exe did not start' }
      - name: Bundle face recognition models
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force models | Out-Null
          Invoke-WebRequest -Uri 'https://huggingface.co/opencv/opencv_zoo/resolve/main/models/face_detection_yunet/face_detection_yunet_2023mar_int8.onnx' -OutFile 'models\face_detection_yunet_2023mar_int8.onnx'
          Invoke-WebRequest -Uri 'https://huggingface.co/opencv/opencv_zoo/resolve/main/models/face_recognition_sface/face_recognition_sface_2021dec_int8.onnx' -OutFile 'models\face_recognition_sface_2021dec_int8.onnx'
          if ((Get-Item 'models\face_detection_yunet_2023mar_int8.onnx').Length -lt 50000) { throw 'YuNet model download is invalid' }
          if ((Get-Item 'models\face_recognition_sface_2021dec_int8.onnx').Length -lt 5000000) { throw 'SFace model download is invalid' }
      - name: Smoke-test OpenCV face runtime
        shell: pwsh
        run: |
          python -c "import cv2; d=cv2.FaceDetectorYN.create(r'models\face_detection_yunet_2023mar_int8.onnx','',(320,320),0.72,0.3,5000); r=cv2.FaceRecognizerSF.create(r'models\face_recognition_sface_2021dec_int8.onnx',''); print('OpenCV face runtime OK')"
      - name: Smoke-test exact 9x16 export pipeline
        shell: pwsh
        run: |
          & tools\ffmpeg.exe -hide_banner -y -f lavfi -i "testsrc2=size=1280x720:rate=30" -f lavfi -i "sine=frequency=440:sample_rate=48000" -t 8 -c:v libx264 -pix_fmt yuv420p -c:a aac smoke_input.mp4
          if ($LASTEXITCODE -ne 0) { throw "Synthetic source creation failed with exit code $LASTEXITCODE" }
          $vf="scale=w=1080:h=1920:force_original_aspect_ratio=increase:flags=lanczos,crop=1080:1920,format=yuv420p"
          & tools\ffmpeg.exe -hide_banner -y -ss 0.5 -i smoke_input.mp4 -t 1.5 -map 0:v:0 -map '0:a:0?' -vf $vf -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -c:a aac -b:a 192k -movflags +faststart smoke_short.mp4
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg smoke export failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path smoke_short.mp4)) { throw "smoke_short.mp4 was not created" }
          $dims=(& tools\ffprobe.exe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 smoke_short.mp4).Trim()
          if ($dims -ne '1080,1920') { throw "Unexpected smoke output dimensions: $dims" }
      - name: Smoke-test 0.3 cuts zoom captions color and audio
        shell: pwsh
        run: |
          python -c "from captions import write_ass; write_ass('smoke_v03.ass',[{'start':0.0,'end':2.4,'text':'Проверка субтитров','words':[]}],{'font_family':'Arial','font_size':64,'animation':'FADE'},'ЦЕЛОСТНЫЙ SHORT',2.0)"
          python -c "from render_engine import render; m={'clip_start':0.5,'clip_end':7.0,'output_duration':5.9,'cuts':[{'src_start':0.5,'src_end':3.0,'out_start':0.0,'out_end':2.5},{'src_start':3.6,'src_end':7.0,'out_start':2.5,'out_end':5.9}],'zooms':[{'start':0.0,'end':3.0,'scale':1.0},{'start':3.0,'end':5.9,'scale':1.1}],'audio_cleanup':'LIGHT','color':{'exposure':0.02,'contrast':1.04,'saturation':1.02,'temperature':0.0,'sharpen':0.0},'music_path':'','broll':[]}; render(r'tools\ffmpeg.exe',r'tools\ffprobe.exe','smoke_input.mp4','smoke_v03.mp4',m,'smoke_v03.ass',None,None,False,True,'smoke_v03.log')"
          if (-not (Test-Path smoke_v03.mp4)) { throw 'Integrated 0.3 render was not created' }
          $dims=(& tools\ffprobe.exe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 smoke_v03.mp4).Trim()
          if ($dims -ne '540,960') { throw "Unexpected 0.3 preview dimensions: $dims" }
      - name: Smoke-test face-focused crop filter
        shell: pwsh
        run: |
          $vf="crop=404:718:320:0,scale=1080:1920:flags=lanczos,format=yuv420p"
          & tools\ffmpeg.exe -hide_banner -y -ss 0.5 -i smoke_input.mp4 -t 1.0 -map 0:v:0 -map '0:a:0?' -vf $vf -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -c:a aac -b:a 192k -movflags +faststart smoke_face_short.mp4
          if ($LASTEXITCODE -ne 0) { throw "Face-focused crop smoke test failed with exit code $LASTEXITCODE" }
          $dims=(& tools\ffprobe.exe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 smoke_face_short.mp4).Trim()
          if ($dims -ne '1080,1920') { throw "Unexpected face-focused output dimensions: $dims" }
      - name: Smoke-test Cyrillic paths
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'тест экспорт' | Out-Null
          Copy-Item smoke_input.mp4 'тест экспорт\Страшно быть уязвимыми 2.mp4'
          $vf="scale=w=1080:h=1920:force_original_aspect_ratio=increase:flags=lanczos,crop=1080:1920,format=yuv420p"
          & tools\ffmpeg.exe -hide_banner -y -ss 0.5 -i 'тест экспорт\Страшно быть уязвимыми 2.mp4' -t 1.0 -map 0:v:0 -map '0:a:0?' -vf $vf -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -c:a aac -b:a 192k -movflags +faststart 'тест экспорт\шорт.mp4'
          if ($LASTEXITCODE -ne 0) { throw "Cyrillic-path export failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path 'тест экспорт\шорт.mp4')) { throw 'Cyrillic-path output was not created' }
      - name: Build app
        shell: pwsh
        run: python -m PyInstaller --clean --noconfirm ShortsCutter.spec
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y
      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ShortsCutter.iss'
      - name: Hash installer
        shell: pwsh
        run: |
          $h=(Get-FileHash dist_installer\ShortsCutterSetup.exe -Algorithm SHA256).Hash.ToLower()
          "$h  ShortsCutterSetup.exe" | Out-File -Encoding ascii dist_installer\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ShortsCutter-Windows
          path: |
            shorts_cutter_beta/dist_installer/ShortsCutterSetup.exe
            shorts_cutter_beta/dist_installer/SHA256SUMS.txt
