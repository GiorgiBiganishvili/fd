name: Build Shorts Cutter Windows Installer
on:
  push:
    branches: [ shorts-cutter-build ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: shorts_cutter_beta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Bundle FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg -y
          New-Item -ItemType Directory -Force tools | Out-Null
          $ff=(Get-Command ffmpeg.exe).Source
          $fp=(Get-Command ffprobe.exe).Source
          Copy-Item $ff tools\ffmpeg.exe
          Copy-Item $fp tools\ffprobe.exe
      - name: Patch export filter to stable chain
        shell: pwsh
        run: |
          $path='main.py'
          $c=Get-Content $path -Raw
          $c=$c.Replace("                    'hqdn3d=1.2:1.2:6:6,'`r`n",'')
          $c=$c.Replace("                    'unsharp=5:5:0.35:5:5:0,'`r`n",'')
          $c=$c.Replace("                    'hqdn3d=1.2:1.2:6:6,'`n",'')
          $c=$c.Replace("                    'unsharp=5:5:0.35:5:5:0,'`n",'')
          Set-Content $path $c -Encoding utf8
          if ((Get-Content $path -Raw) -match 'hqdn3d|unsharp') { throw 'Unstable FFmpeg enhancement filters are still present in main.py' }
      - name: Smoke-test exact 9x16 export pipeline
        shell: pwsh
        run: |
          & tools\ffmpeg.exe -hide_banner -y -f lavfi -i "testsrc2=size=1280x720:rate=30" -f lavfi -i "sine=frequency=440:sample_rate=48000" -t 3 -c:v libx264 -pix_fmt yuv420p -c:a aac smoke_input.mp4
          if ($LASTEXITCODE -ne 0) { throw "Synthetic source creation failed with exit code $LASTEXITCODE" }
          $vf="scale=w=1080:h=1920:force_original_aspect_ratio=increase:flags=lanczos,crop=1080:1920,format=yuv420p"
          & tools\ffmpeg.exe -hide_banner -y -ss 0.5 -i smoke_input.mp4 -t 1.5 -map 0:v:0 -map '0:a:0?' -vf $vf -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -c:a aac -b:a 192k -movflags +faststart smoke_short.mp4
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg smoke export failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path smoke_short.mp4)) { throw "smoke_short.mp4 was not created" }
          $size=(Get-Item smoke_short.mp4).Length
          if ($size -lt 1024) { throw "smoke_short.mp4 is unexpectedly small: $size bytes" }
          $dims=(& tools\ffprobe.exe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 smoke_short.mp4).Trim()
          if ($dims -ne '1080,1920') { throw "Unexpected smoke output dimensions: $dims" }
      - name: Build app
        shell: pwsh
        run: python -m PyInstaller --clean --noconfirm ShortsCutter.spec
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y
      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ShortsCutter.iss'
      - name: Hash installer
        shell: pwsh
        run: |
          $h=(Get-FileHash dist_installer\ShortsCutterSetup.exe -Algorithm SHA256).Hash.ToLower()
          "$h  ShortsCutterSetup.exe" | Out-File -Encoding ascii dist_installer\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ShortsCutter-Windows
          path: |
            shorts_cutter_beta/dist_installer/ShortsCutterSetup.exe
            shorts_cutter_beta/dist_installer/SHA256SUMS.txt
