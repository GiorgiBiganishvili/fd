name: Test desktop workstation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      GTAB_DATA_DIR: /tmp/guitar-tab-ai-tests
      TF_CPP_MIN_LOG_LEVEL: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr libegl1 libopengl0
      - run: uv sync --locked --python 3.11 --extra ml --extra dev
      - run: uv run --no-sync ruff check src tests
      - run: uv run --no-sync pytest -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
