name: Publish Shorts Cutter Release

on:
  push:
    branches: [ shorts-cutter-build ]
    paths:
      - '.github/workflows/publish-shorts-cutter.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download polished Windows artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh api repos/${{ github.repository }}/actions/artifacts/11620598505/zip > artifact.zip
          unzip -q artifact.zip -d release
          find release -maxdepth 3 -type f -print
          test -f release/ShortsCutterSetup.exe
          test -f release/SHA256SUMS.txt

      - name: Publish public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: shorts-cutter-0.3.1-beta
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release exists; replacing assets"
          else
            gh release create "$TAG" --repo "${{ github.repository }}" --target "shorts-cutter-build" --title "Shorts Cutter 0.3.1 Beta — polished workspace" --notes "Polished dark editor-style UI shell for the complete 0.3 workflow. Keeps holistic one-idea Short selection, context titles, editable transcript, face-focused 9:16 crop, speech cleanup, auto zooms, subtitle import/generation, custom fonts, B-roll, music ducking, color/audio controls, preview and clean/finished export. Windows CI smoke-tested the UI shell and full render pipeline before packaging."
          fi
          gh release upload "$TAG" release/ShortsCutterSetup.exe release/SHA256SUMS.txt --repo "${{ github.repository }}" --clobber
