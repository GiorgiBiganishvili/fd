name: Publish Shorts Cutter Release

on:
  push:
    branches: [ shorts-cutter-build ]
    paths:
      - '.github/workflows/publish-shorts-cutter.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download previously built Windows artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh api repos/${{ github.repository }}/actions/artifacts/11615559887/zip > artifact.zip
          unzip -q artifact.zip -d release
          find release -maxdepth 3 -type f -print
          test -f release/ShortsCutterSetup.exe
          test -f release/SHA256SUMS.txt

      - name: Publish public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: shorts-cutter-0.3-beta
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release exists; replacing assets"
          else
            gh release create "$TAG" --repo "${{ github.repository }}" --target "shorts-cutter-build" --title "Shorts Cutter 0.3 Beta — complete short workflow" --notes "Adds holistic one-idea Short selection with context titles, editable transcript, speech cleanup, face-focused 9:16 crop, auto zooms, subtitle generation/import, custom TTF/OTF fonts, B-roll overlays, background music with ducking, basic color/audio processing, proxy preview, clean export, finished export, and subtitle/edit asset export. Windows build smoke-tests integrated cuts + zooms + captions + color + audio, face crop and Cyrillic paths."
          fi
          gh release upload "$TAG" release/ShortsCutterSetup.exe release/SHA256SUMS.txt --repo "${{ github.repository }}" --clobber
